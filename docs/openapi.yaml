openapi: 3.0.3
info:
  title: Cyber Incident Management API
  version: 1.0.0
  description: REST API pencatatan dan tindak lanjut insiden keamanan siber.
servers:
  - url: http://localhost:5000/api/v1
paths:
  /health:
    get:
      summary: Cek API
      responses:
        '200': {description: API aktif}
  /users:
    get:
      summary: Daftar pengguna
      responses:
        '200': {description: Daftar pengguna}
    post:
      summary: Membuat pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: {type: string}
                email: {type: string, format: email}
                role: {type: string}
      responses:
        '201': {description: Dibuat}
        '400': {description: Validasi gagal}
  /assets:
    get:
      summary: Daftar aset
      responses:
        '200': {description: Daftar aset}
    post:
      summary: Membuat aset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_name, asset_type]
              properties:
                asset_name: {type: string}
                asset_type: {type: string}
                ip_address: {type: string}
                criticality: {type: string}
      responses:
        '201': {description: Dibuat}
  /incidents:
    get:
      summary: Daftar insiden dengan pencarian, filter, pagination
      parameters:
        - {in: query, name: search, schema: {type: string}}
        - {in: query, name: severity, schema: {type: string}}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer}}
        - {in: query, name: per_page, schema: {type: integer, maximum: 100}}
      responses:
        '200': {description: Daftar insiden}
    post:
      summary: Melaporkan insiden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, incident_type, user_id, asset_id]
              properties:
                title: {type: string}
                description: {type: string}
                incident_type: {type: string}
                severity: {type: string, enum: [low, medium, high, critical]}
                source_ip: {type: string}
                user_id: {type: integer}
                asset_id: {type: integer}
      responses:
        '201': {description: Insiden dibuat}
        '400': {description: Validasi gagal}
  /incidents/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer}}
    get:
      summary: Detail insiden
      responses:
        '200': {description: Detail}
        '404': {description: Tidak ditemukan}
    patch:
      summary: Ubah status, severity, atau judul
      responses:
        '200': {description: Diperbarui}
    delete:
      summary: Hapus insiden
      responses:
        '200': {description: Dihapus}
  /incidents/{id}/updates:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer}}
    get:
      summary: Riwayat update
      responses:
        '200': {description: Riwayat}
    post:
      summary: Tambah catatan penanganan
      responses:
        '201': {description: Catatan ditambahkan}
  /audit-logs:
    get:
      summary: Audit log terbaru
      responses:
        '200': {description: Audit log}
